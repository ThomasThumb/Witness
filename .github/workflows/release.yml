name: release
on:
  push:
    tags: ["v*"]
  # A manual run builds, hashes and uploads the artifacts and publishes
  # nothing: the dry run to do before the first tag.
  workflow_dispatch:

# Least privilege, per job. The build job runs every dependency's build
# script and a cargo-installed SBOM tool, so it gets a read-only token and no
# OIDC: nothing it runs can publish a release or sign as this repository.
# Every action is pinned to a commit (see ci.yml for why).
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    # Not windows-latest: that image moves (on 2026-09-24 it defaulted to MSVC
    # 14.51 and had no 14.44 ARM64 tools), and the MSVC toolset ends up inside
    # the binary. windows-2022 has Visual Studio 2022 17.14 with MSVC 14.44 for
    # x64 and ARM64; build-release.ps1 pins 14.44 and fails if it cannot.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # rust-toolchain.toml pins the compiler and rustup installs it on first
      # use; the target must be added to that toolchain, not to "stable".
      - run: rustup target add ${{ matrix.target }}
      - name: build (scripts/build-release.ps1 is the one release build command)
        shell: pwsh
        run: ./scripts/build-release.ps1 -Target ${{ matrix.target }}
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - run: cargo cyclonedx --format json --target ${{ matrix.target }} --override-filename sbom
      - name: stage flat, so publish finds every file by name
        shell: pwsh
        run: |
          $t = '${{ matrix.target }}'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/$t/release/witness.exe" "dist/witness-$t.exe"
          Copy-Item "target/$t/release/build-info.txt" "dist/build-info-$t.txt"
          Copy-Item "crates/witness-win/sbom.json" "dist/sbom-$t.json"
          Get-Content "dist/build-info-$t.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: witness-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # Sigstore keyless signing + provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, merge-multiple: true }
      - name: hash
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: keyless sign every artifact
        run: |
          cd dist
          for f in *; do cosign sign-blob --yes --bundle "$f.sigstore" "$f"; done
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: "dist/*.exe" }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          # The identity is exact on purpose. A regexp like
          # 'github.com/ThomasThumb/Witness' also matches a workflow in anyone's
          # repository run on a branch named 'github.com/ThomasThumb/Witness'.
          body: |
            Verify before running:
              cosign verify-blob --bundle witness-x86_64-pc-windows-msvc.exe.sigstore \
                --certificate-identity 'https://github.com/ThomasThumb/Witness/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                witness-x86_64-pc-windows-msvc.exe
              gh attestation verify witness-x86_64-pc-windows-msvc.exe --repo ThomasThumb/Witness \
                --signer-workflow ThomasThumb/Witness/.github/workflows/release.yml

            Rebuild it yourself and compare: check out ${{ github.ref_name }}, install the toolchain
            build-info-x86_64-pc-windows-msvc.txt names (rustc, and the MSVC Build Tools whose
            build numbers it lists), run scripts\build-release.ps1, and compare the SHA-256.

            Authenticode signing via SignPath is added in Phase 4 (BUILD_PLAN.md).
