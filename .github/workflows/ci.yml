name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a commit, not a tag: a tag can be moved to other
# code by whoever controls that repository, a commit cannot. The comment
# names the release the commit was, for whoever updates it. `persist-credentials:
# false` keeps the checkout token out of .git/config, where every later step
# (and every dependency build script) could otherwise read it.
jobs:
  core:
    name: core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - run: cargo fmt --all --check
      - run: cargo clippy -p witness-core --all-targets --locked -- -D warnings
      - run: cargo test -p witness-core --locked

  windows:
    name: windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with: { toolchain: stable, components: "clippy" }
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p witness-win
      # One step per command so a failure is visible from the job's step list
      # alone. pwsh 7.4 fails a step on any non-zero native exit; the tamper
      # step expects one, so it reads $LASTEXITCODE by hand.
      - name: smoke check
        shell: pwsh
        run: .\target\release\witness.exe check
      - name: smoke fingerprint
        shell: pwsh
        run: .\target\release\witness.exe fingerprint
      - name: smoke selftest
        shell: pwsh
        run: .\target\release\witness.exe selftest
      - name: smoke verify
        shell: pwsh
        run: |
          $b = Get-ChildItem "$env:LOCALAPPDATA\Witness\evidence\selftest" -Directory | Select-Object -First 1
          if (-not $b) { throw 'selftest wrote no bundle' }
          .\target\release\witness.exe verify $b.FullName
          $fp = (.\target\release\witness.exe fingerprint)[0].Trim()
          .\target\release\witness.exe verify $b.FullName $fp
      - name: smoke tamper is rejected
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $b = Get-ChildItem "$env:LOCALAPPDATA\Witness\evidence\selftest" -Directory | Select-Object -First 1
          Add-Content -Path (Join-Path $b.FullName 'report.html') -Value '<!-- edited -->'
          .\target\release\witness.exe verify $b.FullName
          if ($LASTEXITCODE -eq 0) { throw 'edited bundle verified OK; that is a bug' }
          "tamper correctly rejected (exit $LASTEXITCODE)"
          # GitHub's pwsh wrapper ends every step with `exit $LASTEXITCODE`, which
          # would report the rejection we just wanted as a failure. Say otherwise.
          exit 0
      - name: smoke wrong fingerprint is rejected
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $b = Get-ChildItem "$env:LOCALAPPDATA\Witness\evidence\selftest" -Directory | Select-Object -Last 1
          .\target\release\witness.exe verify $b.FullName 0000-0000-0000-0000-0000-0000-0000-0000
          if ($LASTEXITCODE -eq 0) { throw 'a wrong expected fingerprint verified OK; that is a bug' }
          "wrong fingerprint correctly rejected (exit $LASTEXITCODE)"
          exit 0
      - name: smoke output names no user
        shell: pwsh
        run: |
          # check and selftest output gets pasted into emails and bug reports.
          # It must show %LOCALAPPDATA%\Witness, never the expanded path.
          $out = (& .\target\release\witness.exe check) + (& .\target\release\witness.exe selftest)
          foreach ($w in $env:USERNAME, $env:USERPROFILE, $env:LOCALAPPDATA) {
            if ($out -match [regex]::Escape($w)) { throw "output contains '$w'" }
          }
          'no user name or profile path in check or selftest output'
      - name: witness.log
        if: always()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\Witness\witness.log" -ErrorAction SilentlyContinue

  supply-chain:
    name: cargo-deny (advisories, bans, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # Covers the RustSec advisory DB too, so no separate audit action (which
      # would need `checks: write`; this workflow stays read-only).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  unsafe-inventory:
    name: unsafe stays where it belongs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: core must contain no unsafe
        run: "! grep -rn 'unsafe' crates/witness-core/src --include='*.rs' | grep -v -E 'forbid|unsafe-inline'"
      - name: windows unsafe is confined to four files
        run: |
          set -e
          bad=$(grep -rln 'unsafe' crates/witness-win/src --include='*.rs' | grep -v -E 'eventlog.rs|keys.rs|harden.rs|notify.rs' || true)
          if [ -n "$bad" ]; then echo "unsafe in unexpected file(s): $bad"; exit 1; fi

  fuzz-smoke:
    name: fuzz (60 s per target, nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with: { toolchain: nightly }
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo +nightly fuzz run winevt_parse -- -max_total_time=60
      - run: cargo +nightly fuzz run rules_parse -- -max_total_time=60

  contacts-fresh:
    name: contacts checked within 6 months
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: python3 scripts/check_contacts.py rules/contacts.toml
