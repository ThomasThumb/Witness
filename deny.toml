# cargo-deny policy. CI fails if any of this is violated.
[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Exactly what the current tree uses. Add to this list in the PR that needs it.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Anything that opens a socket is banned outright. Witness never talks to a network.
deny = [
  { crate = "reqwest" }, { crate = "hyper" }, { crate = "ureq" }, { crate = "tokio" },
  { crate = "openssl" }, { crate = "openssl-sys" }, { crate = "curl" }, { crate = "libcurl-sys" },
  { crate = "native-tls" }, { crate = "rustls" }, { crate = "mio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
